<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenRouter Chatbot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chatbot-container">
    <!-- Header -->
    <div class="chatbot-header">
      <div class="header-content">
        <div class="logo-section">
          <i class="fas fa-comments"></i>
          <h1>Asistente IA</h1>
        </div>
        <div class="header-actions">
          <button id="clear-chat" class="header-btn" title="Limpiar chat">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div id="chat" class="messages-container"></div>
      <div id="loading" class="typing-indicator" style="display: none;">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-section">
      <form id="chat-form" class="chat-form">
        <div class="input-wrapper">
          <textarea 
            id="input" 
            class="message-input" 
            placeholder="Escribe tu pregunta aquí..."
            rows="1"
          ></textarea>
          <button id="send" class="send-button" type="submit" title="Enviar mensaje">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <p class="disclaimer">Powered by OpenRouter</p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
